server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reasonable defaults for the SPA.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json application/wasm image/svg+xml;
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    # Long-lived caches on built assets (Angular emits content-hashed filenames).
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|ico|png|jpe?g|webp|gif)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA fallback — every non-file path returns index.html so Angular routing handles it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Reverse-proxy /api/ to the API container.
    # IMPORTANT: proxy_buffering off and proxy_request_buffering off are required for SSE
    # (FEAT-004 stream endpoints + FEAT-005 notifications stream). Adding intelligence in the
    # middle of a stream is forbidden by the stakeholder definition.
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
    }

    # Health endpoint pass-through (so the host can use `docker-compose healthcheck` on web too if desired).
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
