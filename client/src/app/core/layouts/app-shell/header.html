<header class="h-14 bg-white border-b border-slate-200 px-4 md:px-6 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <button type="button"
            class="md:hidden p-2 -ml-2 text-slate-500 hover:text-slate-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-300 rounded"
            aria-label="Open menu"
            (click)="menuToggle.emit()">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <a routerLink="/" class="text-lg font-bold text-slate-900">DevHub</a>
  </div>

  <div class="hidden md:flex flex-1 max-w-md mx-8">
    <!-- Search slot — populated when the global-search feature lands. -->
    <ng-content select="[header-search]" />
  </div>

  <div class="flex items-center gap-3">
    @if (badgeText(); as badge) {
      <a routerLink="/"
         class="relative p-2 text-slate-500 hover:text-slate-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-300 rounded"
         [attr.aria-label]="'Pending actions: ' + pendingCount()">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .53-.2 1.04-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        <span class="absolute -top-0.5 -right-0.5 inline-flex items-center justify-center bg-amber-500 text-white text-xs font-medium rounded-full h-5 min-w-[24px] px-1">
          {{ badge }}
        </span>
      </a>
    }

    <div class="flex items-center gap-2">
      <div class="h-8 w-8 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-semibold" aria-hidden="true">
        {{ initials() }}
      </div>
      @if (memberName()) {
        <span class="hidden sm:inline text-sm font-medium text-slate-700">{{ memberName() }}</span>
      }
      <button type="button"
              class="text-xs text-slate-500 hover:text-slate-700 underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-300 rounded"
              (click)="logout.emit()">
        Sign out
      </button>
    </div>
  </div>
</header>
