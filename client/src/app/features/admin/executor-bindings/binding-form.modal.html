<app-modal
  [open]="open()"
  title="New binding"
  [dismissOnOverlayClick]="!working()"
  (closed)="onCancel()"
>
  @if (serverError()) {
    <app-error-banner [error]="serverError()" class="block mb-4" />
  }

  @if (!hasActiveExecutors) {
    <div role="alert" class="bg-amber-50 border border-amber-200 text-amber-800 rounded-lg p-3 text-sm mb-4">
      No Active executors registered. Register an executor first.
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4" novalidate>
    <app-form-field
      label="Project type"
      [required]="true"
      [error]="projectTypeError()"
      helperText="Lowercase letters, digits, hyphens. Must match the projectType used when creating projects."
    >
      <input type="text" formControlName="projectType" autocomplete="off"
             class="block w-full border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 rounded-lg px-3 h-10 outline-none font-mono text-sm" />
    </app-form-field>

    <app-form-field
      label="Executor"
      [required]="true"
      [error]="executorError()"
      helperText="Only Active executors are listed."
    >
      <select formControlName="executorId"
              class="block w-full border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 rounded-lg px-3 h-10 outline-none">
        <option value="" disabled>Select an executor…</option>
        @for (e of executors(); track e.id) {
          @if (e.status === 'Active') {
            <option [value]="e.id">{{ e.displayName }} &mdash; {{ e.key }}</option>
          }
        }
      </select>
    </app-form-field>
  </form>

  <ng-container modal-footer>
    <app-button variant="secondary" [disabled]="working()" (clicked)="onCancel()">Cancel</app-button>
    <app-button variant="primary" [loading]="working()" [disabled]="working() || !hasActiveExecutors" (clicked)="onSubmit()">Bind</app-button>
  </ng-container>
</app-modal>
