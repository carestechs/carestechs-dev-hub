<header class="mb-8 flex items-start justify-between gap-4">
  <div>
    <h1 class="text-3xl font-bold">Executors</h1>
    <p class="text-slate-500 mt-2">Registered lifecycle executors and their checkpoint contracts — operators only.</p>
  </div>
  <app-button variant="primary" (clicked)="openRegister()">+ Register executor</app-button>
</header>

<app-table
  [columns]="columns"
  [rows]="executors()"
  [meta]="meta()"
  [loading]="loading()"
  [error]="error()"
  emptyTitle="No executors registered yet."
  emptyDescription="Register a lifecycle executor to start binding project types to it."
  (pageChanged)="onPage($event)"
>
  <ng-container empty-action>
    <app-button variant="primary" (clicked)="openRegister()">+ Register executor</app-button>
  </ng-container>
</app-table>

@if (executors().length > 0 && !loading()) {
  <ul class="mt-4 text-sm text-slate-500 grid gap-1">
    @for (e of executors(); track e.id) {
      <li class="flex items-center gap-3 px-1">
        <span class="font-mono text-slate-700">{{ e.key }}</span>
        <span class="ml-auto space-x-3">
          <button type="button" class="text-sky-600 hover:underline" (click)="openEdit(e)">Edit</button>
          <button type="button" class="text-sky-600 hover:underline" (click)="openReplaceContracts(e)">Replace contracts</button>
          <button type="button" class="text-red-600 hover:underline" (click)="askDelete(e)">Delete</button>
        </span>
      </li>
    }
  </ul>
}

<executor-form-modal
  [open]="modalOpen()"
  [editing]="editing()"
  [availableRoles]="roles()"
  [working]="modalWorking()"
  [serverError]="modalError()"
  (submitted)="onModalSubmit($event)"
  (cancelled)="onModalCancelled()"
/>

<contracts-form-modal
  [open]="contractsOpen()"
  [executor]="contractsTarget()"
  [availableRoles]="roles()"
  [working]="contractsWorking()"
  [serverError]="contractsError()"
  (submitted)="onContractsSubmit($event)"
  (cancelled)="onContractsCancelled()"
/>

<confirm-dialog
  [open]="toDelete() !== null"
  [title]="'Delete executor?'"
  [message]="toDelete() ? 'Soft-delete \'' + toDelete()!.key + '\'? Existing work items still read state but no new projects can be created against it.' : ''"
  confirmLabel="Delete"
  variant="danger"
  [working]="deleting()"
  [error]="deleteError()"
  (confirmed)="onDeleteConfirm()"
  (cancelled)="onDeleteCancel()"
/>
