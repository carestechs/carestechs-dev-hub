<header class="mb-8 flex items-start justify-between gap-4">
  <div>
    <h1 class="text-3xl font-bold">Members</h1>
    <p class="text-slate-500 mt-2">Workspace members — operators only.</p>
  </div>
  <app-button variant="primary" (clicked)="openInvite()">+ Invite member</app-button>
</header>

<section class="bg-white rounded-xl shadow-sm p-4 mb-6">
  <input
    type="search"
    [formControl]="search"
    placeholder="Search by name or email…"
    aria-label="Search members"
    class="w-full max-w-md h-10 px-3 rounded-lg border border-slate-300 text-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-100 outline-none"
  />
</section>

<app-table
  [columns]="columns"
  [rows]="members()"
  [meta]="meta()"
  [loading]="loading()"
  [error]="error()"
  emptyTitle="No members yet."
  emptyDescription="Invite your first member to get started."
  (sortChanged)="onSort($event)"
  (pageChanged)="onPage($event)"
>
  <ng-container empty-action>
    <app-button variant="primary" (clicked)="openInvite()">+ Invite member</app-button>
  </ng-container>
</app-table>

@if (members().length > 0 && !loading()) {
  <ul class="mt-4 text-sm text-slate-500 grid gap-1">
    @for (m of members(); track m.id) {
      <li class="flex items-center gap-3 px-1">
        <span class="font-medium text-slate-700">{{ m.displayName }}</span>
        <span class="text-slate-500">{{ m.email }}</span>
        <span class="ml-auto space-x-3">
          <button type="button" class="text-sky-600 hover:underline" (click)="openEdit(m)">Edit</button>
          <button type="button" class="text-red-600 hover:underline" (click)="askDelete(m)">Delete</button>
        </span>
      </li>
    }
  </ul>
}

<member-form-modal
  [open]="modalOpen()"
  [editing]="editing()"
  [working]="modalWorking()"
  [serverError]="modalError()"
  (submitted)="onModalSubmit($event)"
  (cancelled)="onModalCancelled()"
/>

<confirm-dialog
  [open]="toDelete() !== null"
  [title]="'Delete member?'"
  [message]="toDelete() ? 'Delete member \'' + toDelete()!.displayName + '\'? This is a soft delete; their project memberships are revoked.' : ''"
  confirmLabel="Delete"
  variant="danger"
  [working]="deleting()"
  [error]="deleteError()"
  (confirmed)="onDeleteConfirm()"
  (cancelled)="onDeleteCancel()"
/>
