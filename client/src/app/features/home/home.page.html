<header class="mb-8">
  <h1 class="text-3xl font-bold">
    @if (displayName()) {
      Welcome back, {{ displayName() }}
    } @else {
      Welcome
    }
  </h1>
  <p class="text-slate-500 mt-2">Today's overview.</p>
</header>

<section class="mb-12">
  <h2 class="text-xl font-semibold mb-4">Pending on you</h2>
  <app-card>
    <empty-state
      title="You're all caught up."
      description="When a checkpoint waits on your role in any project, it shows up here." />
  </app-card>
</section>

<section>
  <div class="flex items-baseline justify-between mb-4">
    <h2 class="text-xl font-semibold">Your projects</h2>
    <a routerLink="/projects" class="text-sm text-sky-600 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-300 rounded">
      Browse all →
    </a>
  </div>

  @if (projectsLoading()) {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" aria-busy="true">
      @for (i of [1,2,3]; track i) {
        <div class="bg-white rounded-xl shadow-sm p-6 space-y-3">
          <div class="h-4 w-2/3 bg-slate-200 rounded animate-pulse"></div>
          <div class="h-3 w-1/3 bg-slate-200 rounded animate-pulse"></div>
          <div class="flex gap-2">
            <div class="h-5 w-20 bg-slate-200 rounded-full animate-pulse"></div>
          </div>
        </div>
      }
    </div>
  } @else if (projects().length === 0) {
    <app-card>
      <empty-state
        title="No projects yet."
        description="An operator hasn't added you to any project yet." />
    </app-card>
  } @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (p of projects(); track p.id) {
        <project-card [project]="p" (opened)="onProjectOpen($event)" />
      }
    </div>
  }
</section>
