<a [routerLink]="project() ? ['/projects', project()!.slug] : ['/projects']" class="text-sm text-sky-600 hover:underline">← Project</a>

<header class="mt-6 mb-8 flex items-start justify-between gap-4">
  <div>
    <h1 class="text-3xl font-bold">Memberships</h1>
    @if (project(); as p) {
      <p class="text-slate-500 mt-2 font-mono">{{ p.slug }} · {{ p.owningTeam.name }}</p>
    }
  </div>
  @if (project()) {
    <app-button variant="primary" (clicked)="openAdd()">+ Add member</app-button>
  }
</header>

<app-table
  [columns]="columns"
  [rows]="memberships()"
  [meta]="null"
  [loading]="loading()"
  [error]="error()"
  emptyTitle="No memberships yet."
  emptyDescription="Add a workspace member to grant them access to this project."
>
  <ng-container empty-action>
    <app-button variant="primary" (clicked)="openAdd()">+ Add member</app-button>
  </ng-container>
</app-table>

@if (memberships().length > 0 && !loading()) {
  <ul class="mt-4 text-sm text-slate-500 grid gap-1">
    @for (m of memberships(); track m.id) {
      <li class="flex items-center gap-3 px-1">
        <span class="font-medium text-slate-700">{{ m.member.displayName }}</span>
        <span class="text-slate-500">{{ m.member.email }}</span>
        <span class="ml-auto space-x-3">
          <button type="button" class="text-sky-600 hover:underline" (click)="openEdit(m)">Edit roles</button>
          <button type="button" class="text-red-600 hover:underline" (click)="askRemove(m)">Remove</button>
        </span>
      </li>
    }
  </ul>
}

<membership-form-modal
  [open]="modalOpen()"
  [editing]="editing()"
  [assignableMembers]="assignableMembers()"
  [availableRoles]="availableRoles()"
  [working]="modalWorking()"
  [serverError]="modalError()"
  (submitted)="onModalSubmit($event)"
  (cancelled)="onModalCancelled()"
/>

<confirm-dialog
  [open]="toRemove() !== null"
  [title]="'Remove membership?'"
  [message]="toRemove() ? 'Remove ' + toRemove()!.member.displayName + ' from this project? Their role assignments are revoked.' : ''"
  confirmLabel="Remove"
  variant="danger"
  [working]="removing()"
  [error]="removeError()"
  (confirmed)="onRemoveConfirm()"
  (cancelled)="onRemoveCancel()"
/>
