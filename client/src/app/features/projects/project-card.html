@let p = project();
<h3 class="font-semibold text-base mb-2">{{ p.name }}</h3>
<p class="text-xs text-slate-500 mb-3 font-mono">{{ p.slug }}</p>
<div class="flex items-center gap-2 mb-4">
  <span class="inline-flex items-center rounded-full bg-slate-100 text-slate-700 text-xs font-medium px-2 py-0.5">
    {{ p.owningTeam.name }}
  </span>
  <span class="inline-flex items-center rounded-full bg-sky-100 text-sky-700 text-xs font-medium px-2 py-0.5">
    {{ p.projectType }}
  </span>
</div>
<p class="text-sm text-slate-500">
  @if (p.inFlightWorkItems === 0) {
    No in-flight work
  } @else if (p.inFlightWorkItems === 1) {
    1 in-flight item
  } @else {
    {{ p.inFlightWorkItems }} in-flight items
  }
</p>
