<section class="bg-white rounded-xl shadow-sm p-6">
  <h3 class="text-base font-semibold mb-1">Review brief</h3>
  <p class="text-sm text-slate-500 mb-4">
    Review the generated brief and confirm or reject it.
    @if (parsed().work_item_id; as wid) {
      <span class="ml-1 font-mono text-xs bg-slate-100 rounded px-1.5 py-0.5">{{ wid }}</span>
    }
  </p>

  <!-- Summary / source rendered as markdown -->
  @if (markdownSource(); as md) {
    <div class="mb-4 bg-slate-50 rounded-lg p-4 border border-slate-200">
      <markdown-renderer [source]="md" />
    </div>
  }

  <!-- Title field -->
  <label class="block text-sm font-medium text-slate-700 mb-1">Title</label>
  <input type="text" autocomplete="off"
         [value]="title()"
         (input)="title.set($any($event.target).value)"
         [disabled]="working()"
         placeholder="Work item title"
         class="block w-full border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 rounded-lg px-3 h-10 outline-none disabled:bg-slate-50 mb-3" />

  <!-- Type dropdown -->
  <label class="block text-sm font-medium text-slate-700 mb-1">Type</label>
  <select [value]="type()"
          (change)="type.set($any($event.target).value)"
          [disabled]="working()"
          class="block w-full border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 rounded-lg px-3 h-10 outline-none disabled:bg-slate-50 mb-4">
    <option value="FEAT">Feature (FEAT)</option>
    <option value="BUG">Bug (BUG)</option>
    <option value="IMP">Improvement (IMP)</option>
  </select>

  @if (rejecting()) {
    <!-- Reject mode: feedback textarea -->
    <label class="block text-sm font-medium text-slate-700 mb-1">Feedback</label>
    <textarea rows="3"
              [value]="feedback()"
              (input)="feedback.set($any($event.target).value)"
              [disabled]="working()"
              placeholder="Explain why this brief should be revised..."
              class="block w-full border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 rounded-lg px-3 py-2 outline-none disabled:bg-slate-50 text-sm mb-4"></textarea>

    <div class="flex items-center justify-end gap-2">
      <button type="button"
              class="text-sm text-slate-500 hover:text-slate-700 px-3 h-10"
              [disabled]="working()"
              (click)="toggleReject()">
        Cancel
      </button>
      <button type="button"
              class="bg-red-500 disabled:bg-slate-300 disabled:cursor-not-allowed text-white text-sm font-medium px-4 h-10 rounded-lg hover:bg-red-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-300"
              [disabled]="!canReject()"
              (click)="onReject()">
        @if (working()) { Submitting... } @else { Reject brief }
      </button>
    </div>
  } @else {
    <!-- Confirm mode -->
    <div class="flex items-center justify-end gap-2">
      @if (!canAct()) {
        <span class="text-xs text-slate-500 mr-auto">You don't have the role required for this action.</span>
      }
      <button type="button"
              class="text-sm text-red-500 hover:text-red-700 px-3 h-10"
              [disabled]="working() || !canAct()"
              (click)="toggleReject()">
        Reject
      </button>
      <button type="button"
              class="bg-sky-500 disabled:bg-slate-300 disabled:cursor-not-allowed text-white text-sm font-medium px-4 h-10 rounded-lg hover:bg-sky-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-300"
              [disabled]="!canSubmit()"
              (click)="onConfirm()">
        @if (working()) { Submitting... } @else { Confirm brief }
      </button>
    </div>
  }
</section>
