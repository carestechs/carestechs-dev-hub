<label class="block">
  @if (label()) {
    <span class="block text-sm font-medium text-slate-700 mb-1">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500" aria-hidden="true">*</span>
      }
    </span>
  }
  <ng-content />
  @if (hasError()) {
    <p class="mt-1 text-sm text-red-600" aria-live="polite">{{ error() }}</p>
  } @else if (helperText()) {
    <p class="mt-1 text-xs text-slate-500">{{ helperText() }}</p>
  }
</label>
