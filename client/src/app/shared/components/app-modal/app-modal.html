@if (open()) {
  <div
    class="fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-sm"
    aria-hidden="true"
    (click)="onOverlayClick()"
  ></div>
  <div class="fixed inset-0 z-50 flex items-start justify-center p-6 overflow-y-auto">
    <div
      #panel
      class="bg-white rounded-xl shadow-lg w-full"
      [class]="widthClass()"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="title() ? 'app-modal-title' : null"
    >
      @if (title()) {
        <header class="px-6 py-4 border-b border-slate-200 flex items-start justify-between gap-4">
          <h2 id="app-modal-title" class="text-lg font-semibold">{{ title() }}</h2>
          <button
            type="button"
            class="text-slate-400 hover:text-slate-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-300 rounded"
            aria-label="Close"
            (click)="requestClose()"
          >
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </header>
      }

      <div class="px-6 py-5">
        <ng-content />
      </div>

      <footer class="px-6 py-4 border-t border-slate-200 flex items-center justify-end gap-3">
        <ng-content select="[modal-footer]" />
      </footer>
    </div>
  </div>
}
