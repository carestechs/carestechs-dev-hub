services:
  postgres:
    image: postgres:16-alpine
    container_name: devhub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-devhub}
    volumes:
      - devhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-devhub} -d $${POSTGRES_DB:-devhub}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    image: devhub-api:latest
    container_name: devhub-api
    build:
      context: .
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-devhub};Username=${POSTGRES_USER:-devhub};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer:     "${Jwt__Issuer}"
      Jwt__Audience:   "${Jwt__Audience}"
      Jwt__SigningKey: "${Jwt__SigningKey}"
      Cors__SpaOrigin: "${Cors__SpaOrigin}"
      OperatorSeed__Email:        "${OperatorSeed__Email}"
      OperatorSeed__DisplayName:  "${OperatorSeed__DisplayName}"
      OperatorSeed__Password:     "${OperatorSeed__Password}"
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    image: devhub-web:latest
    container_name: devhub-web
    build:
      context: ./client
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  devhub-pgdata:
