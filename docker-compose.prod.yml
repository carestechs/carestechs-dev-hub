# Production deployment under the DevTools umbrella.
#
# Assumes the shared `devtools-infra` network and the shared `postgres`
# container already exist (`cd ../infra && docker compose up -d`). The
# `devhub` database must exist on that cluster; see docs/umbrella-adaptation.md
# for the one-shot CREATE DATABASE if your infra volume pre-dates this repo's
# inclusion in init-databases.sql.
#
# Lifecycle: bring up everything umbrella-wide via `../start.sh`, or run this
# file directly with `--env-file .env.production`. The sibling
# `docker-compose.yml` is the solo-dev flow (its own postgres on 127.0.0.1:5434).

services:
  api:
    image: devhub-api:latest
    container_name: devhub-api
    build:
      context: .
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-devhub};Username=${POSTGRES_USER:-devtools};Password=${POSTGRES_PASSWORD:-devtools}"
      Jwt__Issuer:     "${Jwt__Issuer}"
      Jwt__Audience:   "${Jwt__Audience}"
      Jwt__SigningKey: "${Jwt__SigningKey}"
      Cors__SpaOrigin: "${Cors__SpaOrigin}"
      OperatorSeed__Email:       "${OperatorSeed__Email}"
      OperatorSeed__DisplayName: "${OperatorSeed__DisplayName}"
      OperatorSeed__Password:    "${OperatorSeed__Password}"
      ORCHESTRATOR_API_KEY: "${ORCHESTRATOR_API_KEY}"
      GitHub__Pat:          "${GitHub__Pat}"
      GitHub__Owner:        "${GitHub__Owner}"
      GitHub__ScaffoldRepo: "${GitHub__ScaffoldRepo}"
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [infra]
    ports:
      # Optional loopback-only publication — peers on the infra network reach
      # this via `devhub-api:8080`. Loopback bind matches orchestrator-api's
      # ops ergonomic; strip this block if you want internal-only.
      - "127.0.0.1:${API_HOST_PORT:-8090}:8080"
    restart: unless-stopped

  web:
    image: devhub-web:latest
    container_name: devhub-web
    build:
      context: ./client
    depends_on:
      api:
        condition: service_healthy
    networks: [infra]
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-4300}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

networks:
  infra:
    external: true
    name: devtools-infra
