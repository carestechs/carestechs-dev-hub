services:
  postgres:
    image: postgres:16-alpine
    container_name: devhub-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-devhub}
    ports:
      # Loopback-only and shifted to 5434 so this dev compose can coexist
      # with the DevTools umbrella's shared postgres on 127.0.0.1:5433.
      # Upstream defaults at 5432 are intentionally avoided.
      - "127.0.0.1:5434:5432"
    volumes:
      - devhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devhub-pgdata:
