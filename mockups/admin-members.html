<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DevHub — Admin · Members mockup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { font-family: 'Inter', system-ui, sans-serif; background: #F8FAFC; color: #334155; }
    h1, h2, h3 { font-family: 'Poppins', system-ui, sans-serif; color: #0F172A; }
  </style>
</head>
<body class="min-h-screen py-8 px-4 md:px-6">
  <main class="mx-auto max-w-5xl space-y-8">
    <header class="flex items-start justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold">Members</h1>
        <p class="text-slate-500 mt-2">Workspace members — operators only.</p>
      </div>
      <button class="rounded-lg font-medium h-10 px-4 bg-sky-500 text-white hover:bg-sky-600">+ Invite member</button>
    </header>

    <section class="bg-white rounded-xl shadow-sm p-4">
      <input type="search" placeholder="Search by name or email…" class="w-full max-w-md h-10 px-3 rounded-lg border border-slate-300 text-sm focus:border-sky-500 focus:ring-2 focus:ring-sky-100 outline-none">
    </section>

    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <table class="min-w-full">
        <thead class="bg-slate-50 text-xs font-medium text-slate-500 uppercase tracking-wide">
          <tr>
            <th class="px-6 py-3 text-left">Display name</th>
            <th class="px-6 py-3 text-left">Email</th>
            <th class="px-6 py-3 text-left">Status</th>
            <th class="px-6 py-3 text-left">Created</th>
            <th class="px-6 py-3"></th>
          </tr>
        </thead>
        <tbody class="text-sm text-slate-700">
          <tr class="border-t border-slate-200 hover:bg-slate-50">
            <td class="px-6 py-3 font-medium">Operator</td>
            <td class="px-6 py-3">operator@devhub.local</td>
            <td class="px-6 py-3"><span class="inline-flex items-center rounded-full bg-emerald-100 text-emerald-700 text-xs font-medium px-2 py-0.5">Active</span></td>
            <td class="px-6 py-3">2026-05-01</td>
            <td class="px-6 py-3 text-right space-x-2">
              <button class="text-sky-600 hover:underline text-sm">Edit</button>
              <button class="text-red-600 hover:underline text-sm">Delete</button>
            </td>
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50">
            <td class="px-6 py-3 font-medium">Alice Reviewer</td>
            <td class="px-6 py-3">alice@team.local</td>
            <td class="px-6 py-3"><span class="inline-flex items-center rounded-full bg-amber-100 text-amber-700 text-xs font-medium px-2 py-0.5">Invited</span></td>
            <td class="px-6 py-3">2026-05-14</td>
            <td class="px-6 py-3 text-right space-x-2">
              <button class="text-sky-600 hover:underline text-sm">Edit</button>
              <button class="text-red-600 hover:underline text-sm">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Invite modal -->
    <section>
      <h2 class="text-base font-semibold text-slate-500 uppercase tracking-wide mb-2">Invite modal</h2>
      <div class="bg-white rounded-xl shadow-lg max-w-lg">
        <header class="px-6 py-4 border-b border-slate-200">
          <h3 class="text-lg font-semibold">Invite member</h3>
        </header>
        <div class="px-6 py-5 space-y-4">
          <label class="block">
            <span class="block text-sm font-medium text-slate-700 mb-1">Display name <span class="text-red-500">*</span></span>
            <input type="text" class="block w-full border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 rounded-lg px-3 h-10 outline-none">
          </label>
          <label class="block">
            <span class="block text-sm font-medium text-slate-700 mb-1">Email <span class="text-red-500">*</span></span>
            <input type="email" class="block w-full border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 rounded-lg px-3 h-10 outline-none">
            <p class="mt-1 text-xs text-slate-500">The member is created with status <em>Invited</em>; activate them in the edit modal once they're onboarded.</p>
          </label>
        </div>
        <footer class="px-6 py-4 border-t border-slate-200 flex items-center justify-end gap-3">
          <button class="rounded-lg font-medium h-10 px-4 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50">Cancel</button>
          <button class="rounded-lg font-medium h-10 px-4 bg-sky-500 text-white hover:bg-sky-600">Invite</button>
        </footer>
      </div>
    </section>
  </main>
</body>
</html>
