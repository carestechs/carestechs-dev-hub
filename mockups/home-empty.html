<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DevHub — Home (empty) mockup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { font-family: 'Inter', system-ui, sans-serif; background: #F8FAFC; color: #334155; }
    h1, h2, h3 { font-family: 'Poppins', system-ui, sans-serif; color: #0F172A; }
  </style>
</head>
<body class="py-8 px-4 md:px-6">
  <main class="mx-auto max-w-5xl space-y-12">
    <header>
      <h1 class="text-3xl font-bold">Welcome back, Operator</h1>
      <p class="text-slate-500 mt-2">Today's overview.</p>
    </header>

    <section>
      <h2 class="text-xl font-semibold mb-4">Pending on you</h2>
      <div class="bg-white rounded-xl shadow-sm">
        <div class="text-center py-12">
          <svg class="mx-auto h-12 w-12 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 13l4 4L19 7"/></svg>
          <h3 class="mt-4 text-lg font-semibold">You're all caught up.</h3>
          <p class="mt-2 text-sm text-slate-500 max-w-sm mx-auto">When a checkpoint waits on your role in any project, it shows up here.</p>
        </div>
      </div>
    </section>

    <section>
      <h2 class="text-xl font-semibold mb-4">Your projects</h2>
      <div class="bg-white rounded-xl shadow-sm">
        <div class="text-center py-12">
          <svg class="mx-auto h-12 w-12 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7h18M3 12h18M3 17h18"/></svg>
          <h3 class="mt-4 text-lg font-semibold">No projects yet.</h3>
          <p class="mt-2 text-sm text-slate-500 max-w-sm mx-auto">An operator hasn't added you to any project yet.</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
